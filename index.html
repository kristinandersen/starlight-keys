<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Starlight Keys">
<meta name="theme-color" content="#24124a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Starlight Keys</title>
<style>
:root{
  --bg:#1b0f3a; --bg2:#3a1a6e; --ink:#ffffff; --ink2:rgba(255,255,255,.72);
  --card:rgba(255,255,255,.10); --card-line:rgba(255,255,255,.16);
  --pink:#ff5fd2; --violet:#9b6bff; --cyan:#3ee8ff; --gold:#ffd54a;
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1b0f3a; --ink:#fff; } }
:root[data-theme="dark"]{ --bg:#1b0f3a; --ink:#fff; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;touch-action:none;display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px)}
#menu{overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(120% 70% at 50% 0%, #6b3bd6 0%, transparent 60%),
             radial-gradient(90% 60% at 100% 100%, #e0409f 0%, transparent 60%),
             linear-gradient(160deg,#2a1563,#160b33)}
.logo{font-weight:900;font-size:clamp(40px,9vw,72px);letter-spacing:-.02em;line-height:.95;text-align:center;margin-top:12px;
  background:linear-gradient(90deg,#fff,#ffd1f5 40%,#a9f3ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,95,210,.45))}
.logo .star{display:inline-block;-webkit-text-fill-color:var(--gold);color:var(--gold);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.18) rotate(12deg)}}
.tag{color:var(--ink2);font-size:17px;margin:12px 0 22px;text-align:center}
#songs{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
.song{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;
  background:var(--card);border:1px solid var(--card-line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:transform .12s}
.song:active{transform:scale(.97)}
.disc{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:28px;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 18px rgba(0,0,0,.25)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.best{margin-top:5px;font-size:14px;color:var(--ink2)}
.best .s{color:var(--gold);letter-spacing:1px}
.lvl{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:1px}
.lvl.Easy{background:#2fd47d33;color:#7dffb6}.lvl.Medium{background:#ffb72b33;color:#ffd47a}.lvl.Hard{background:#ff4f7a33;color:#ff9ab3}
.play{flex:none;font-weight:900;font-size:15px;padding:10px 16px;border-radius:99px;color:#2a1050;
  background:linear-gradient(90deg,#fff,#ffe0f6)}
.opts{width:100%;max-width:560px;margin:20px 0 8px;display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:rgba(0,0,0,.18)}
.opts label{flex:1;font-size:16px}
.opts small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.sw{all:unset;position:relative;flex:none;width:54px;height:32px;border-radius:99px;background:rgba(255,255,255,.25);transition:background .2s;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:#36d483}.sw[aria-checked="true"]::after{transform:translateX(22px)}
.how{max-width:560px;color:var(--ink2);font-size:14px;text-align:center;line-height:1.5;margin-top:8px}
.modal{justify-content:center;background:rgba(20,8,45,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:8}
.panel{width:100%;max-width:400px;text-align:center;padding:28px 22px;border-radius:28px;
  background:linear-gradient(160deg,rgba(120,70,230,.9),rgba(220,70,170,.88));border:2px solid rgba(255,255,255,.35);
  box-shadow:0 20px 60px rgba(0,0,0,.4)}
.panel h2{margin:0 0 4px;font-size:24px}
.panel .sub{color:var(--ink2);font-size:15px;margin-bottom:10px}
.bigstars{font-size:52px;letter-spacing:6px;color:rgba(255,255,255,.28);margin:6px 0}
.bigstars .on{color:var(--gold);text-shadow:0 0 18px rgba(255,213,74,.7)}
.crowns{font-size:20px;color:var(--gold);min-height:24px}
.bigscore{font-size:64px;font-weight:900;line-height:1;margin:6px 0}
.newbest{display:inline-block;background:var(--gold);color:#3a1b00;font-weight:900;padding:4px 12px;border-radius:99px;font-size:14px;margin-bottom:8px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.btn{all:unset;cursor:pointer;padding:15px;border-radius:99px;font-weight:900;font-size:18px;text-align:center;background:#fff;color:#4a1a8a}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn:active{transform:scale(.97)}
#pauseBtn{all:unset;position:fixed;z-index:6;top:calc(env(safe-area-inset-top) + 14px);left:14px;width:44px;height:44px;border-radius:50%;
  background:rgba(0,0,0,.22);display:grid;place-items:center;cursor:pointer}
#pauseBtn::before{content:"";width:14px;height:16px;border-left:5px solid #fff;border-right:5px solid #fff;box-sizing:border-box}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="pauseBtn" class="hidden" aria-label="Pause"></button>

<div id="menu" class="screen">
  <div class="logo">Starlight<br>Keys <span class="star">★</span></div>
  <div class="tag">Tap the dark tiles. Hold the long ones. Don't miss!</div>
  <div id="songs"></div>
  <div class="opts">
    <label for="practice">Practice mode<small>Misses don't end the game</small></label>
    <button id="practice" class="sw" role="switch" aria-checked="false"></button>
  </div>
  <div class="how">Every song keeps going and gets faster after the 3rd star.<br>How long can you last?</div>
</div>

<div id="pauseScr" class="screen modal hidden">
  <div class="panel">
    <h2>Paused</h2>
    <div class="btns">
      <button class="btn" id="resumeBtn">Resume</button>
      <button class="btn ghost" id="restartBtn">Restart</button>
      <button class="btn ghost" id="quitBtn">Songs</button>
    </div>
  </div>
</div>

<div id="result" class="screen modal hidden">
  <div class="panel">
    <h2 id="rName"></h2>
    <div class="sub" id="rSub"></div>
    <div class="bigstars" id="rStars"></div>
    <div class="crowns" id="rCrowns"></div>
    <div class="bigscore" id="rScore">0</div>
    <div id="rBest"></div>
    <div class="btns">
      <button class="btn" id="retryBtn">Play again</button>
      <button class="btn ghost" id="songsBtn">Songs</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============ SONGS (all public domain) ============
   mel: "pitch/steps" tokens, "-" = rest. acc: chord names (C, Am, F#m, G7) or pitches. */
const SONGS = [
 {id:"twinkle", name:"Twinkle Twinkle Little Star", by:"Traditional", level:"Easy", speed:1.9, hold:2, c:["#5b8cff","#b45cff"],
  mel:"C5 C5 G5 G5 A5 A5 G5/2 F5 F5 E5 E5 D5 D5 C5/2 G5 G5 F5 F5 E5 E5 D5/2 G5 G5 F5 F5 E5 E5 D5/2 C5 C5 G5 G5 A5 A5 G5/2 F5 F5 E5 E5 D5 D5 C5/2",
  acc:"C/2 C/2 F/2 C/2 F/2 C/2 G/2 C/2 C/2 F/2 C/2 G/2 C/2 F/2 C/2 G/2 C/2 C/2 F/2 C/2 F/2 C/2 G/2 C/2"},
 {id:"birthday", name:"Happy Birthday", by:"Traditional", level:"Easy", speed:1.7, hold:2, c:["#ff8a3d","#ff4fa3"],
  mel:"G4/.5 G4/.5 A4 G4 C5 B4/2 G4/.5 G4/.5 A4 G4 D5 C5/2 G4/.5 G4/.5 G5 E5 C5 B4 A4 F5/.5 F5/.5 E5 C5 D5 C5/3",
  acc:"-/1 C/3 G/3 G/3 C/3 C/3 F/3 C/2 G/1 C/3"},
 {id:"ode", name:"Ode to Joy", by:"Beethoven", level:"Easy", speed:2.1, hold:2, c:["#29d07a","#2bb6ff"],
  mel:"E5 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 E5/1.5 D5/.5 D5/2 E5 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 D5/1.5 C5/.5 C5/2 D5 D5 E5 C5 D5 E5/.5 F5/.5 E5 C5 D5 E5/.5 F5/.5 E5 D5 C5 D5 G4/2 E5 E5 F5 G5 G5 F5 E5 D5 C5 C5 D5 E5 D5/1.5 C5/.5 C5/2",
  acc:"C/4 G/4 C/4 C/2 G/2 C/4 G/4 C/4 G/2 C/2 G/2 C/2 G/2 C/2 G/2 C/2 C/2 G/2 C/4 G/4 C/4 G/2 C/2"},
 {id:"jingle", name:"Jingle Bells", by:"J. Pierpont", level:"Medium", speed:2.3, hold:2, c:["#ff4f6a","#2fd47d"],
  mel:"E5 E5 E5/2 E5 E5 E5/2 E5 G5 C5/1.5 D5/.5 E5/4 F5 F5 F5/1.5 F5/.5 F5 E5 E5 E5/.5 E5/.5 E5 D5 D5 E5 D5/2 G5/2 E5 E5 E5/2 E5 E5 E5/2 E5 G5 C5/1.5 D5/.5 E5/4 F5 F5 F5 F5 F5 E5 E5 E5/.5 E5/.5 G5 G5 F5 D5 C5/4",
  acc:"C/4 C/4 C/4 C/4 F/4 C/4 D/4 G/4 C/4 C/4 C/4 C/4 F/4 C/4 G/4 C/4"},
 {id:"canon", name:"Canon in D", by:"Pachelbel", level:"Medium", speed:3.0, hold:4, c:["#ffd54a","#ff7a2f"],
  mel:"F#5/4 E5/4 D5/4 C#5/4 B4/4 A4/4 B4/4 C#5/4 D5/2 A4/2 C#5/2 A4/2 B4/2 F#4/2 A4/2 F#4/2 G4/2 D4/2 F#4/2 D4/2 G4/2 B4/2 A4/2 C#5/2 F#5/2 D5 E5 F#5/2 D5 E5 F#5 F#4 G4 A4 B4 C#5 D5 E5 D5/2 B4 C#5 D5/2 D4 E4 F#4 G4 F#4 E4 F#4 D5 C#5 D5",
  acc:"D/4 A/4 Bm/4 F#m/4 G/4 D/4 G/4 A/4 D/4 A/4 Bm/4 F#m/4 G/4 D/4 G/4 A/4 D/4 A/4 Bm/4 F#m/4 G/4 D/4 G/4 A/4"},
 {id:"elise", name:"Für Elise", by:"Beethoven", level:"Hard", speed:4.2, hold:3, c:["#ff5fd2","#7a5cff"],
  mel:"E5 D#5 E5 D#5 E5 B4 D5 C5 A4/2 -/1 C4 E4 A4 B4/2 -/1 E4 G#4 B4 C5/2 -/1 E4 E5 D#5 E5 D#5 E5 B4 D5 C5 A4/2 -/1 C4 E4 A4 B4/2 -/1 E4 C5 B4 A4/4",
  acc:"-/8 A2 E3 A3 -/3 E2 E3 G#3 -/3 A2 E3 A3 -/3 -/6 A2 E3 A3 -/3 E2 E3 G#3 -/3 A2 E3 A3/2"},
 {id:"mountain", name:"Hall of the Mountain King", by:"Grieg", level:"Hard", speed:3.4, hold:4, c:["#38c8ff","#3a2bb0"],
  mel:"B3 C#4 D4 E4 F#4 D4 F#4/2 F4 C#4 F4/2 E4 C4 E4/2 B3 C#4 D4 E4 F#4 D4 F#4 B4 A4 F#4 D4 F#4 A4/4 B4 C#5 D5 E5 F#5 D5 F#5/2 F5 C#5 F5/2 E5 C5 E5/2 B4 C#5 D5 E5 F#5 D5 F#5 B5 A5 F#5 D5 F#5 A5/4",
  acc:"B2/2 F#2/2 B2/2 F#2/2 C#3/2 G#2/2 C3/2 G2/2 B2/2 F#2/2 B2/2 F#2/2 B2/2 F#2/2 B2/4 B2/2 F#2/2 B2/2 F#2/2 C#3/2 G#2/2 C3/2 G2/2 B2/2 F#2/2 B2/2 F#2/2 B2/2 F#2/2 B2/4"},
];

/* ============ parsing ============ */
const NI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function toMidi(s){const m=/^([A-G])([#b]?)(-?\d)$/.exec(s); if(!m) return null;
  return 12*(+m[3]+1)+NI[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0);}
function parseSeq(str){const out=[];let t=0;
  for(const tok of str.trim().split(/\s+/)){const [p,d]=tok.split("/");const len=d===undefined?1:parseFloat(d);
    if(p!=="-") out.push({p,t,len}); t+=len;}
  return {notes:out,total:t};}
function chordNotes(sym){const m=/^([A-G])([#b]?)(m7|maj7|m|7)?$/.exec(sym); if(!m) return null;
  const n=NI[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0); const q=m[3]||"";
  const iv=q==="m"?[0,3,7]:q==="7"?[0,4,7,10]:q==="m7"?[0,3,7,10]:q==="maj7"?[0,4,7,11]:[0,4,7];
  return {bass:36+n, tri:iv.map(i=>48+n+i)};}
for(const s of SONGS){ const m=parseSeq(s.mel); s.notes=m.notes.map(n=>({...n,midi:toMidi(n.p)})); s.total=m.total;
  s.accEv=parseSeq(s.acc).notes; }

/* ============ storage (best-effort) ============ */
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let BEST=load("sk_best",{}); let PRACTICE=load("sk_practice",false);

/* ============ audio ============ */
let ac=null, master, rev;
function initAudio(){
  if(ac){ if(ac.state!=="running") ac.resume(); return; }
  try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  ac=new AC();
  const comp=ac.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4; comp.connect(ac.destination);
  master=ac.createGain(); master.gain.value=0.9; master.connect(comp);
  rev=ac.createConvolver(); const len=Math.floor(ac.sampleRate*2.2), buf=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
  rev.buffer=buf; const rg=ac.createGain(); rg.gain.value=0.22; rev.connect(rg); rg.connect(comp);
  const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0);
  if(ac.state!=="running") ac.resume();
}
function piano(m, when, vel, hold){
  if(!ac) return {release(){}};
  const f=440*Math.pow(2,(m-69)/12);
  const out=ac.createGain(), lp=ac.createBiquadFilter(); lp.type="lowpass";
  lp.frequency.setValueAtTime(Math.min(14000,f*9),when);
  lp.frequency.exponentialRampToValueAtTime(Math.max(f*2.5,500),when+1.4);
  lp.connect(out); out.connect(master); out.connect(rev);
  const decay=Math.max(0.7,2.8-(m-48)*0.035), g=out.gain;
  g.setValueAtTime(0.0001,when); g.linearRampToValueAtTime(vel,when+0.006);
  if(hold) g.setTargetAtTime(vel*0.3,when+0.01,0.7); else g.setTargetAtTime(0.0001,when+0.01,decay/4.5);
  const oscs=[];
  for(const [h,a,type] of [[1,1,"triangle"],[2,.38,"sine"],[3,.14,"sine"],[4,.07,"sine"],[0.5,.12,"sine"]]){
    const o=ac.createOscillator(); o.type=type; o.frequency.value=f*h; o.detune.value=(Math.random()-.5)*5;
    const og=ac.createGain(); og.gain.value=a; o.connect(og); og.connect(lp); o.start(when); oscs.push(o);}
  const stop=t=>oscs.forEach(o=>{try{o.stop(t)}catch(e){}});
  if(!hold) stop(when+decay*1.8+0.1); else stop(when+30);
  return {release(t){ t=Math.max(t||0,ac.currentTime);
    if(g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t); else g.cancelScheduledValues(t);
    g.setTargetAtTime(0.0001,t,0.1); stop(t+0.9);} };
}
function playAcc(a, when){
  const c=chordNotes(a.p);
  if(c){ piano(c.bass,when,0.2,false); c.tri.forEach(n=>piano(n,when+0.004,0.085,false)); }
  else { const m=toMidi(a.p); if(m!=null) piano(m,when,0.22,false); }
}
function bonk(){ if(!ac) return; const t=ac.currentTime;
  for(const f of [110,116]){const o=ac.createOscillator(),g=ac.createGain(); o.type="sawtooth"; o.frequency.setValueAtTime(f,t);
    o.frequency.exponentialRampToValueAtTime(f*0.6,t+0.5); g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.65);} }

/* ============ canvas & layout ============ */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1, L={};
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  const pw=Math.min(W,H*0.8); L={pw, left:(W-pw)/2, lw:pw/4, rowH:H/4, u:Math.max(0.75,Math.min(1.6,pw/420))}; }
window.addEventListener("resize",resize); resize();

/* ============ game state ============ */
let G=null, SEL=0;
function rngFrom(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000;};}
function newGame(i){
  const song=SONGS[i]; SEL=i;
  G={song, tiles:[], built:0, pos:0, running:false, started:false, over:false, paused:false, countdown:0,
     score:0, hits:0, combo:0, grade:null, gradeAt:0, prevLane:null, prevMidi:null, rng:rngFrom(Date.now()),
     parts:[], ripples:[], pops:[], shapes:[], failInfo:null, failAt:0, rewind:null, practice:PRACTICE, n:song.notes.length};
  for(let k=0;k<9;k++) G.shapes.push({x:Math.random(),y:Math.random(),s:0.15+Math.random()*0.35,r:Math.random()*6,v:0.02+Math.random()*0.04});
  buildLoop(); buildLoop();
  G.pos=G.tiles[0].r-1.35;
}
function speedNow(){ if(!G) return 1; const t=G.song.total, loop=Math.max(0,Math.floor(G.pos/t)), frac=Math.max(0,(G.pos-loop*t)/t);
  return G.song.speed*(1+0.14*loop)*(1+0.07*frac); }
function pickLane(m){ let o=[0,1,2,3].filter(l=>l!==G.prevLane);
  if(G.prevLane!=null&&G.prevMidi!=null){
    if(m>G.prevMidi){const up=o.filter(l=>l>G.prevLane); if(up.length&&G.rng()<0.7) o=up;}
    else if(m<G.prevMidi){const dn=o.filter(l=>l<G.prevLane); if(dn.length&&G.rng()<0.7) o=dn;} }
  const l=o[Math.floor(G.rng()*o.length)]; G.prevLane=l; G.prevMidi=m; return l; }
function buildLoop(){
  const s=G.song, off=G.built*s.total, start=G.tiles.length;
  for(const n of s.notes){ const hold=n.len>=s.hold;
    G.tiles.push({lane:pickLane(n.midi), r:off+n.t, len:n.len, h:hold?n.len:Math.min(1,n.len), hold, midi:n.midi,
      hit:false, done:false, missed:false, pid:null, voice:null, fill:0, hitAt:0, acc:[], loop:G.built}); }
  for(const e of s.accEv){ let idx=0; for(let j=0;j<s.notes.length;j++){ if(s.notes[j].t<=e.t+1e-6) idx=j; else break; }
    G.tiles[start+idx].acc.push({p:e.p, off:Math.max(0,e.t-s.notes[idx].t)}); }
  G.built++;
}

/* ============ input ============ */
function tileRect(t){ const yb=H-(t.r-G.pos)*L.rowH; return {x:L.left+t.lane*L.lw, yb, yt:yb-t.h*L.rowH}; }
function onDown(id,x,y){
  initAudio();
  if(!G||G.over||G.paused||G.countdown>0) return;
  const lane=Math.floor((x-L.left)/L.lw); if(lane<0||lane>3) return;
  if(y<70*L.u && G.started) return; // HUD strip
  let best=null;
  for(const t of G.tiles){ if(t.hit||t.missed||t.lane!==lane) continue;
    if(!G.started && t!==G.tiles[0]) continue;
    const r=tileRect(t); if(r.yt>H) continue;
    if(y>=r.yt-0.15*L.rowH && y<=r.yb+0.3*L.rowH){ if(!best||t.r<best.r) best=t; } }
  if(best){ hit(best,id,x,y); return; }
  if(!G.started) return;
  if(G.practice){ G.combo=0; G.ripples.push({x,y,t:performance.now(),bad:true}); return; }
  fail({lane, y});
}
function onUp(id){ if(!G) return; for(const t of G.tiles){ if(t.pid===id && !t.done){ endHold(t,false); } } }
function hit(t,id,x,y){
  const now=performance.now(), d=t.r-G.pos;
  t.hit=true; t.hitAt=now;
  const when=ac?ac.currentTime:0, sp=speedNow();
  if(t.hold){ t.pid=id; t.voice=piano(t.midi,when,0.5,true); } else { piano(t.midi,when,0.5,false); t.done=true; }
  for(const a of t.acc) playAcc(a, when+a.off/sp);
  G.score+=1; G.hits+=1;
  if(!G.started){ G.started=true; G.running=true; G.grade=null; }
  else { const g=d<1.3?"PERFECT":d<2.4?"GREAT":"GOOD"; G.combo=g==="PERFECT"?G.combo+1:0; G.grade=g; G.gradeAt=now; }
  const r=tileRect(t), cx=r.x+L.lw/2, cy=t.hold?r.yb-L.rowH*0.4:(r.yt+r.yb)/2;
  burst(cx,cy,t.hold?"#7ff6ff":"#ffffff",10);
  G.ripples.push({x:cx,y:cy,t:now});
}
function endHold(t,complete){
  t.done=true; if(t.voice) t.voice.release(ac?ac.currentTime+(complete?0.05:0):0);
  const bonus=Math.max(0,Math.round(complete?t.len:t.fill)-1);
  G.score+=bonus;
  const r=tileRect(t);
  if(bonus>0) G.pops.push({x:r.x+L.lw/2, y:Math.max(r.yt,90*L.u)+30, txt:"+"+(bonus+1), t:performance.now()});
  if(complete) burst(r.x+L.lw/2, Math.max(r.yt,60), "#7ff6ff",16);
}
function fail(info){
  G.over=true; G.running=false; G.failInfo=info; G.failAt=performance.now(); bonk();
  for(const t of G.tiles) if(t.hold&&t.hit&&!t.done){ t.done=true; t.voice&&t.voice.release(); }
  if(info.tile){ G.rewind={from:G.pos,to:info.tile.r-1.2,t:performance.now()}; }
  setTimeout(()=>showResult(true),1300);
}
cv.addEventListener("pointerdown",e=>{e.preventDefault(); try{cv.setPointerCapture(e.pointerId)}catch(_){ } onDown(e.pointerId,e.clientX,e.clientY);});
cv.addEventListener("pointerup",e=>onUp(e.pointerId));
cv.addEventListener("pointercancel",e=>onUp(e.pointerId));
cv.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
cv.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());

/* ============ effects ============ */
function burst(x,y,col,n){ for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, v=80+Math.random()*220;
  G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:0.6+Math.random()*0.4,age:0,col,s:2+Math.random()*3,star:Math.random()<0.3});} }

/* ============ update ============ */
function update(dt,now){
  if(!G) return;
  if(G.countdown>0){ G.countdown-=dt; if(G.countdown<=0){G.countdown=0; G.running=true;} }
  if(G.rewind){ const k=Math.min(1,(now-G.rewind.t)/450), e=1-Math.pow(1-k,3); G.pos=G.rewind.from+(G.rewind.to-G.rewind.from)*e; }
  if(G.running){ G.pos+=speedNow()*dt; }
  while(G.built*G.song.total < G.pos+12) buildLoop();
  if(G.running){
    for(const t of G.tiles){
      if(t.hold&&t.hit&&!t.done){ t.fill=Math.max(0,Math.min(t.len,G.pos-t.r+1)); if(t.fill>=t.len-0.02) endHold(t,true); }
      if(!t.hit&&!t.missed&&t.r-G.pos < -0.45){
        if(G.practice){ t.missed=true; t.hitAt=now; G.combo=0; }
        else { fail({tile:t, lane:t.lane}); break; }
      }
    }
    // trim
    while(G.tiles.length && G.tiles[0].done && G.tiles[0].r+G.tiles[0].h < G.pos-3) G.tiles.shift();
    while(G.tiles.length && G.tiles[0].missed && G.tiles[0].r+G.tiles[0].h < G.pos-3) G.tiles.shift();
  }
  for(const s of G.shapes){ s.y+=s.v*dt*(G.running?1.6:0.4); if(s.y>1.3){s.y=-0.3; s.x=Math.random();} s.r+=dt*0.1; }
  G.parts=G.parts.filter(p=>{p.age+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=380*dt; return p.age<p.life;});
  G.ripples=G.ripples.filter(r=>now-r.t<420);
  G.pops=G.pops.filter(p=>now-p.t<900);
}

/* ============ drawing ============ */
const PAL=[["#4f7dff","#b45cff"],["#26c97a","#9be84a"],["#ffb72b","#ff7a2f"],["#ff5fc8","#a24dff"],["#38c8ff","#6a5cff"]];
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,k){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(",")})`;}
function rrect(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function font(sz,w=900){return `${w} ${Math.round(sz)}px ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif`;}
function starPath(cx,cy,R,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r:R; ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}ctx.closePath();}

function draw(now){
  if(!G) return;
  const s=G.song, ph=((Math.max(0,G.pos)/s.total)*4)%PAL.length, i0=Math.floor(ph), k=ph-i0, i1=(i0+1)%PAL.length;
  const top=mix(PAL[i0][0],PAL[i1][0],k), bot=mix(PAL[i0][1],PAL[i1][1],k);
  const g=ctx.createLinearGradient(0,0,W*0.3,H); g.addColorStop(0,top); g.addColorStop(1,bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // drifting shapes
  for(const sh of G.shapes){ ctx.save(); ctx.translate(sh.x*W, sh.y*H); ctx.rotate(sh.r+0.6); const z=sh.s*Math.max(W,H)*0.6;
    ctx.fillStyle="rgba(255,255,255,0.07)"; ctx.fillRect(-z/2,-z/2,z,z); ctx.strokeStyle="rgba(255,255,255,0.10)"; ctx.lineWidth=2; ctx.strokeRect(-z*0.35,-z*0.35,z*0.7,z*0.7); ctx.restore(); }
  // side dim
  if(L.left>1){ ctx.fillStyle="rgba(10,0,30,0.28)"; ctx.fillRect(0,0,L.left,H); ctx.fillRect(L.left+L.pw,0,W-L.left-L.pw,H); }
  // glow band (perfect zone hint)
  const by=H-1.3*L.rowH, bg=ctx.createLinearGradient(0,by-40,0,by+40);
  bg.addColorStop(0,"rgba(255,255,255,0)"); bg.addColorStop(.5,"rgba(255,255,255,0.16)"); bg.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=bg; ctx.fillRect(L.left,by-40,L.pw,80);
  // lanes
  ctx.fillStyle="rgba(255,255,255,0.45)";
  for(let l=1;l<4;l++) ctx.fillRect(Math.round(L.left+l*L.lw)-0.5,0,1,H);
  if(L.left>1){ ctx.fillRect(L.left-0.5,0,1,H); ctx.fillRect(L.left+L.pw-0.5,0,1,H); }

  // tiles
  const pad=1.5;
  for(const t of G.tiles){
    const r=tileRect(t); if(r.yb<-10||r.yt>H+10) continue;
    const x=r.x+pad, w=L.lw-pad*2, y=r.yt+pad, h=r.yb-r.yt-pad*2;
    if(G.failInfo&&G.failInfo.tile===t){ const on=Math.floor((now-G.failAt)/180)%2===0;
      ctx.fillStyle=on?"#ff2d55":"#5a0a1a"; rrect(x,y,w,h,6); ctx.fill(); continue; }
    if(t.missed){ const a=Math.max(0.15,1-(now-t.hitAt)/500)*0.6; ctx.fillStyle=`rgba(255,45,85,${a})`; rrect(x,y,w,h,6); ctx.fill(); continue; }
    if(t.hit && (t.done && (!t.hold || true)) && !(t.hold && !t.done)){
      const a=Math.max(0.10,0.45-(now-t.hitAt)/600); ctx.fillStyle=`rgba(255,255,255,${a})`; rrect(x,y,w,h,6); ctx.fill(); continue; }
    // unhit or holding
    const tg=ctx.createLinearGradient(0,y,0,y+h); tg.addColorStop(0,"#262338"); tg.addColorStop(0.25,"#0b0a12"); tg.addColorStop(1,"#000");
    ctx.fillStyle=tg; rrect(x,y,w,h,6); ctx.fill();
    if(t.hold){
      ctx.fillStyle="rgba(120,240,255,0.55)"; ctx.fillRect(x+w/2-1.5,y+18,3,h-30);
      if(t.hit){ const fh=Math.max(L.rowH*0.35,t.fill*L.rowH); const fy=r.yb-fh;
        const cg=ctx.createLinearGradient(0,fy,0,r.yb); cg.addColorStop(0,"#b8fbff"); cg.addColorStop(0.15,"#3ee8ff"); cg.addColorStop(1,"#1f8bff");
        ctx.save(); ctx.shadowColor="#3ee8ff"; ctx.shadowBlur=24; ctx.fillStyle=cg; rrect(x,Math.max(fy,y),w,r.yb-Math.max(fy,y)-pad,w/2); ctx.fill(); ctx.restore();
        ctx.beginPath(); ctx.arc(x+w/2,Math.max(fy,y)+w*0.28,w*0.13,0,Math.PI*2); ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=3; ctx.stroke();
      } else { ctx.beginPath(); ctx.arc(x+w/2,r.yb-w*0.42,w*0.15,0,Math.PI*2); ctx.strokeStyle="rgba(140,245,255,.9)"; ctx.lineWidth=3; ctx.stroke(); }
    }
    if(!G.started && t===G.tiles[0]){ ctx.fillStyle="#fff"; ctx.font=font(Math.min(w*0.22,30*L.u),800); ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("START",x+w/2,y+h/2); }
  }
  // wrong-tap flash
  if(G.failInfo&&!G.failInfo.tile){ const on=Math.floor((now-G.failAt)/180)%2===0; const fi=G.failInfo;
    ctx.fillStyle=on?"rgba(255,45,85,.85)":"rgba(255,45,85,.3)"; rrect(L.left+fi.lane*L.lw+2,fi.y-L.rowH/2,L.lw-4,L.rowH,6); ctx.fill(); }
  // ripples
  for(const rp of G.ripples){ const k=Math.max(0,Math.min(1,(now-rp.t)/420)); ctx.beginPath(); ctx.arc(rp.x,rp.y,10+k*L.lw*0.5,0,Math.PI*2);
    ctx.strokeStyle=rp.bad?`rgba(255,60,90,${1-k})`:`rgba(255,255,255,${0.8*(1-k)})`; ctx.lineWidth=4*(1-k)+1; ctx.stroke(); }
  // particles
  for(const p of G.parts){ const a=1-p.age/p.life; ctx.globalAlpha=a; ctx.fillStyle=p.col;
    if(p.star){ starPath(p.x,p.y,p.s*2.2,p.s); ctx.fill(); } else { ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); } }
  ctx.globalAlpha=1;

  drawHUD(now);
}
function drawHUD(now){
  const u=L.u, cx=L.left+L.pw/2, s=G.song, sa=Math.max(14,parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sat"))||0);
  const topY=28*u+sa;
  // progress line with stars
  const prog=G.hits/G.n, x0=cx-L.pw*0.33, x1=cx+L.pw*0.33;
  ctx.lineCap="round"; ctx.lineWidth=3*u;
  ctx.strokeStyle="rgba(255,255,255,0.45)"; ctx.beginPath(); ctx.moveTo(x0,topY); ctx.lineTo(x1,topY); ctx.stroke();
  const pf=Math.min(1,prog); ctx.strokeStyle="#fff"; ctx.beginPath(); ctx.moveTo(x0,topY); ctx.lineTo(x0+(x1-x0)*pf,topY); ctx.stroke();
  for(let i=1;i<=3;i++){ const sx=x0+(x1-x0)*i/3, on=prog>=i/3;
    ctx.save(); if(on){ctx.shadowColor="#ffd54a"; ctx.shadowBlur=14;} starPath(sx,topY,11*u,5*u); ctx.fillStyle=on?"#ffd54a":"rgba(255,255,255,.85)"; ctx.fill(); ctx.restore(); }
  ctx.beginPath(); ctx.arc(x0,topY,4*u,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill();
  const crowns=Math.max(0,Math.floor(G.hits/G.n)-1);
  if(crowns>0){ ctx.font=font(18*u,900); ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillStyle="#ffd54a"; ctx.fillText("♛×"+crowns,x1+16*u,topY); }
  if(!G.started){
    // title banner
    const yb=H*0.36; ctx.fillStyle="rgba(255,255,255,0.16)"; ctx.fillRect(L.left,yb-48*u,L.pw,96*u);
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle="#fff";
    ctx.font=font(24*u,900); ctx.fillText(s.name,cx,yb-20*u);
    ctx.font=font(15*u,600); ctx.fillStyle="rgba(255,255,255,.85)"; ctx.fillText(s.by,cx,yb+6*u);
    const b=BEST[s.id]; ctx.font=font(14*u,800); ctx.fillStyle="#ffd54a"; ctx.fillText("Best: "+(b?b.score:0),cx,yb+28*u);
    return;
  }
  // score
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font=font(54*u,900); ctx.lineWidth=6; ctx.strokeStyle="rgba(60,20,110,.25)"; ctx.strokeText(G.score,cx,topY+52*u);
  ctx.fillStyle="#fff"; ctx.fillText(G.score,cx,topY+52*u);
  // grade
  if(G.grade){ const age=(now-G.gradeAt)/1000; if(age<0.9){
    const sc=age<0.12?0.7+age/0.12*0.4:age<0.2?1.1-(age-0.12)/0.08*0.1:1, a=age>0.65?1-(age-0.65)/0.25:1;
    ctx.save(); ctx.globalAlpha=Math.max(0,a); ctx.translate(cx,topY+100*u); ctx.scale(sc,sc);
    ctx.font=font(34*u,900);
    const gr=ctx.createLinearGradient(0,-18*u,0,18*u);
    if(G.grade==="PERFECT"){gr.addColorStop(0,"#fff0fb");gr.addColorStop(.5,"#ff7ad9");gr.addColorStop(1,"#b06bff");}
    else if(G.grade==="GREAT"){gr.addColorStop(0,"#efffff");gr.addColorStop(.5,"#5ff2ff");gr.addColorStop(1,"#2aa8ff");}
    else {gr.addColorStop(0,"#fffbe8");gr.addColorStop(1,"#ffc23d");}
    ctx.lineWidth=5; ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.strokeText(G.grade,0,0); ctx.fillStyle=gr; ctx.fillText(G.grade,0,0);
    if(G.grade==="PERFECT"&&G.combo>1){ ctx.font=font(20*u,900); ctx.fillStyle="#fff"; ctx.textAlign="left"; ctx.fillText("×"+G.combo, 78*u, 18*u); }
    ctx.restore(); } }
  // pops
  for(const p of G.pops){ const k=(now-p.t)/900; ctx.globalAlpha=1-k; ctx.font=font(30*u,900); ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.fillText(p.txt,p.x,p.y-k*40); }
  ctx.globalAlpha=1;
  if(G.countdown>0){ ctx.fillStyle="rgba(0,0,0,.25)"; ctx.fillRect(0,0,W,H); ctx.font=font(110*u,900); ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.fillText(Math.ceil(G.countdown),cx,H/2); }
}

/* ============ loop ============ */
let last=performance.now();
function frame(){ const now=performance.now(); const dt=Math.max(0,Math.min(0.05,(now-last)/1000)); last=now;
  try{ if(G){update(dt,now); draw(now);} }catch(e){ console.error(e); }
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);

/* ============ UI ============ */
const $=id=>document.getElementById(id);
function starsTxt(n){let s="";for(let i=0;i<3;i++)s+=i<n?"★":"<span style=\"opacity:.3\">★</span>";return s;}
function renderMenu(){
  $("songs").innerHTML="";
  SONGS.forEach((s,i)=>{ const b=BEST[s.id]; const el=document.createElement("button"); el.className="song";
    el.innerHTML=`<div class="disc" style="--c1:${s.c[0]};--c2:${s.c[1]}">♪</div>
      <div class="meta"><b>${s.name}</b><small>${s.by}<span class="lvl ${s.level}">${s.level}</span></small>
      <div class="best"><span class="s">${starsTxt(b?b.stars:0)}</span>${b&&b.crowns?` <span class="s">♛${b.crowns}</span>`:""} · Best ${b?b.score:0}</div></div>
      <span class="play">PLAY</span>`;
    el.addEventListener("click",()=>{ initAudio(); startSong(i); });
    $("songs").appendChild(el); });
  $("practice").setAttribute("aria-checked",String(PRACTICE));
}
$("practice").addEventListener("click",()=>{ PRACTICE=!PRACTICE; save("sk_practice",PRACTICE); $("practice").setAttribute("aria-checked",String(PRACTICE)); });
function startSong(i){ newGame(i); $("menu").classList.add("hidden"); $("result").classList.add("hidden"); $("pauseScr").classList.add("hidden"); $("pauseBtn").classList.remove("hidden"); }
function toMenu(){ G=null; renderMenu(); $("menu").classList.remove("hidden"); $("result").classList.add("hidden"); $("pauseScr").classList.add("hidden"); $("pauseBtn").classList.add("hidden"); }
function pause(){ if(!G||G.over||G.paused) return; G.paused=true; G.running=false; G.countdown=0;
  for(const t of G.tiles) if(t.hold&&t.hit&&!t.done) endHold(t,false);
  $("pauseScr").classList.remove("hidden"); }
$("pauseBtn").addEventListener("click",pause);
$("resumeBtn").addEventListener("click",()=>{ initAudio(); $("pauseScr").classList.add("hidden"); G.paused=false; if(G.started) G.countdown=3; });
$("restartBtn").addEventListener("click",()=>startSong(SEL));
$("quitBtn").addEventListener("click",()=>{ if(G&&G.practice&&G.started){ $("pauseScr").classList.add("hidden"); showResult(false);} else toMenu(); });
$("retryBtn").addEventListener("click",()=>{ initAudio(); startSong(SEL); });
$("songsBtn").addEventListener("click",toMenu);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pause(); });
function showResult(failed){
  if(!G) return; const s=G.song, stars=Math.min(3,Math.floor(3*G.hits/G.n+1e-9)), crowns=Math.max(0,Math.floor(G.hits/G.n)-1);
  const b=BEST[s.id]||{score:0,stars:0,crowns:0}; let isNew=false;
  if(!G.practice){ if(G.score>b.score){isNew=b.score>0||G.score>0; b.score=G.score;} b.stars=Math.max(b.stars||0,stars); b.crowns=Math.max(b.crowns||0,crowns); BEST[s.id]=b; save("sk_best",BEST); }
  $("rName").textContent=s.name;
  $("rSub").textContent=G.practice?"Practice round":(stars>=3?"Amazing!":stars===2?"Great playing!":stars===1?"Nice start!":"Oops! Try again");
  $("rStars").innerHTML=[0,1,2].map(i=>`<span class="${i<stars?"on":""}">★</span>`).join("");
  $("rCrowns").textContent=crowns?"♛".repeat(Math.min(crowns,5))+(crowns>5?" ×"+crowns:""):"";
  $("rScore").textContent=G.score;
  $("rBest").innerHTML=isNew&&!G.practice?`<span class="newbest">NEW BEST!</span>`:`<div class="sub">Best: ${b.score}</div>`;
  $("result").classList.remove("hidden"); $("pauseBtn").classList.add("hidden");
}
renderMenu();
window.__sk={get G(){return G}, L:()=>L, onDown, onUp, startSong, SONGS};
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
